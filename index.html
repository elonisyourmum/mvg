<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVV · Abfahrten</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@300;400;500;600;700&display=swap');

  :root{
    --bg:#0c0a06;
    --ink:#efe6d2;          /* creme */
    --gold:#c9a227;         /* messing */
    --gold-dim:#5e5021;
    --amber:#ffcf6b;
    --soon:#e8743b;
    --deco:'Limelight',serif;
    --body:'Josefin Sans',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:var(--body);
    color:var(--ink);
    background:
      radial-gradient(130% 90% at 50% -20%, #1c1709 0%, var(--bg) 55%);
    padding:2.4vmin 3vmin 3vmin;
    overflow-y:auto;min-height:100vh;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  /* dünner Goldrahmen ums Ganze (Deco) */
  body::before{
    content:"";position:fixed;inset:1.1vmin;
    border:1px solid var(--gold-dim);border-radius:4px;
    pointer-events:none;z-index:1;
  }

  .topbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;gap:1.4vmin;
    background:var(--bg);
    padding:.4vmin 0 1vmin;
    border-bottom:1px solid var(--gold);
    box-shadow:0 3px 0 -1px var(--gold-dim);
    margin-bottom:1.6vmin;
  }
  .logo{
    font-family:var(--deco);color:#0c0a06;background:var(--gold);
    font-size:clamp(.8rem,2.8vmin,1.15rem);line-height:1;
    padding:.36em .5em .28em;border-radius:3px;letter-spacing:.08em;
  }
  .topbar h1{
    font-family:var(--deco);font-weight:400;
    font-size:clamp(1rem,3.4vmin,1.5rem);
    letter-spacing:.22em;color:var(--ink);text-transform:uppercase;
  }
  .topbar .clock{
    margin-left:auto;font-family:var(--deco);color:var(--amber);
    font-size:clamp(1rem,3.3vmin,1.45rem);letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
  }

  .board{display:flex;flex-direction:column;gap:1.5vmin;position:relative;z-index:2;}
  .weg{padding:.4vmin 0;}
  .person{
    font-family:var(--deco);font-weight:400;
    font-size:clamp(.95rem,3vmin,1.3rem);letter-spacing:.14em;
    color:var(--gold);text-transform:uppercase;
    border-bottom:1px solid var(--gold-dim);
    padding-bottom:.5vmin;margin-bottom:.5vmin;
  }

  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem;
       padding:.5vmin 0;border-bottom:1px dotted #2a2412;}
  .row:last-child{border-bottom:none;}
  .badge{color:#fff;border-radius:3px;font-weight:700;font-family:var(--body);
         padding:.1em .42em;min-width:2.3em;text-align:center;
         font-size:clamp(.75rem,2.4vmin,1rem);letter-spacing:.02em;
         box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
  .dest{font-size:clamp(.85rem,2.7vmin,1.12rem);font-weight:500;letter-spacing:.02em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .min{font-size:clamp(.85rem,2.7vmin,1.12rem);color:var(--amber);text-align:right;
       white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em;}
  .min.soon{color:var(--soon);}
  .delay{color:var(--soon);font-size:.72em;}
  .empty,.err{color:var(--gold-dim);font-size:clamp(.78rem,2.3vmin,.95rem);padding:.4vmin 0;font-style:italic;}
  .err{color:var(--soon);}
  .updated{text-align:center;color:var(--gold-dim);font-size:.72rem;margin-top:1.4vmin;
           letter-spacing:.16em;text-transform:uppercase;position:relative;z-index:2;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">MVV</span>
    <h1>Abfahrten</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="board" id="board"></div>
  <div class="updated" id="updated"></div>

<script>
const WEGE = [
  { person: "Silberhornstraße",  id: "de:09162:1170", filterLine: "", filterZiel: "" },
  { person: "Ostfriedhof",       id: "de:09162:1105", filterLine: "", filterZiel: "" },
  { person: "St.-Martin-Straße", id: "de:09162:1100", filterLine: "", filterZiel: "" },
  { person: "Kolumbusplatz",     id: "de:09162:160",  filterLine: "", filterZiel: "" },
];

const PRIO_UBAHN = true;
const PRO_WEG    = 6;
const INTERVALL  = 30000;

const API = "https://www.mvg.de/api/bgw-pt/v3";
const PROXIES = [""];   // Fully Kiosk: "Disable Web Security" muss AN sein

async function holen(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const ziel = p ? p + encodeURIComponent(url) : url;
      const r = await fetch(ziel);
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("Kein Zugriff");
}

/* Münchner Linienfarben (S5 dunkelblau) */
const LINIEN = {
  U1:"#438136", U2:"#C20831", U3:"#EC6726", U4:"#00A984", U5:"#BC7A00", U6:"#0065B1", U7:"#C20831", U8:"#EC6726",
  S1:"#16BAE7", S2:"#76B82A", S3:"#9B268F", S4:"#E30613", S5:"#1c3f94", S6:"#00975F", S7:"#943126", S8:"#5A5A5A", S20:"#ED6B22"
};
function farbe(label){
  const l=(label||"").toUpperCase();
  if(LINIEN[l]) return LINIEN[l];
  if(l.startsWith("S")) return "#00903a";
  if(l.startsWith("U")) return "#0065B1";
  return "#d11e2a";
}

async function abfahrten(id){ return await holen(`${API}/departures?globalId=${id}&limit=20`); }

function matcht(dep,weg){
  const label=(dep.label||"").toUpperCase();
  const ziel =(dep.destination||"").toLowerCase();
  if(weg.filterLine){
    const f=weg.filterLine.toUpperCase().replace("TRAM ","").replace("BUS ","").trim();
    if(!label.startsWith(f)) return false;
  }
  if(weg.filterZiel && !ziel.includes(weg.filterZiel.toLowerCase())) return false;
  return true;
}
function minuten(dep){ return Math.round(((dep.realtimeDepartureTime||dep.plannedDepartureTime)-Date.now())/60000); }

async function renderWeg(weg){
  const el=document.createElement("div");el.className="weg";
  el.innerHTML=`<div class="person">${weg.person}</div>`;
  try{
    let deps=(await abfahrten(weg.id)).filter(d=>!d.cancelled && matcht(d,weg) && minuten(d)>=0);
    deps.sort((a,b)=>{
      if(PRIO_UBAHN){
        const ua=(a.transportType==="UBAHN")?0:1, ub=(b.transportType==="UBAHN")?0:1;
        if(ua!==ub) return ua-ub;
      }
      return minuten(a)-minuten(b);
    });
    deps=deps.slice(0,PRO_WEG);
    if(deps.length===0){ el.innerHTML+=`<div class="empty">Keine passenden Abfahrten</div>`; }
    else for(const d of deps){
      const m=minuten(d), txt=m<=0?"jetzt":m+" min";
      const delay=(d.delayInMinutes>0)?`<span class="delay"> +${d.delayInMinutes}</span>`:"";
      el.innerHTML+=`<div class="row">
          <span class="badge" style="background:${farbe(d.label)}">${d.label||"?"}</span>
          <span class="dest">${d.destination||""}</span>
          <span class="min ${m<=2?'soon':''}">${txt}${delay}</span></div>`;
    }
  }catch(e){ el.innerHTML+=`<div class="err">⚠️ ${e.message||"Fehler beim Laden"}</div>`; }
  return el;
}

async function update(){
  const teile=await Promise.all(WEGE.map(renderWeg));
  document.getElementById("board").replaceChildren(...teile);
  document.getElementById("updated").textContent=
    "Stand "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function clock(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
clock(); setInterval(clock,10000);
update(); setInterval(update,INTERVALL);
</script>
</body>
</html>
