<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVV Abfahrten</title>
<style>
  :root{
    --bg:#0a0c0f; --panel:#13171d; --line:#222a33;
    --ink:#f2f5f8; --muted:#7c8896; --mvv:#00a13a;
    --amber:#ffb000; --soon:#ff5a4d;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:var(--sys);
    background:var(--bg);color:var(--ink);
    padding:2vmin 2.6vmin 3vmin;
    overflow-y:auto;min-height:100vh;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;align-items:center;gap:1.2vmin;
    border-bottom:2px solid var(--mvv);
    padding-bottom:.9vmin;margin-bottom:1.3vmin;
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .logo{
    background:var(--mvv);color:#fff;font-weight:700;
    font-size:clamp(.85rem,3vmin,1.25rem);line-height:1;letter-spacing:.04em;
    padding:.28em .46em;border-radius:7px;
  }
  .topbar h1{font-size:clamp(.85rem,2.9vmin,1.2rem);letter-spacing:.04em;text-transform:uppercase;font-weight:700;}
  .topbar .clock{margin-left:auto;color:var(--amber);font-size:clamp(.9rem,3vmin,1.25rem);font-weight:600;font-variant-numeric:tabular-nums;}

  .board{display:flex;flex-direction:column;gap:1vmin;}
  .weg{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:.9vmin 1.2vmin;}
  .person{font-weight:700;font-size:clamp(.9rem,2.8vmin,1.2rem);letter-spacing:.01em;margin-bottom:.4vmin;}

  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;
       padding:.42vmin 0;border-top:1px solid var(--line);}
  .row:first-of-type{border-top:none;}
  .badge{color:#fff;border-radius:5px;font-weight:700;
         padding:.12em .42em;min-width:2.3em;text-align:center;font-size:clamp(.75rem,2.4vmin,1rem);}
  .dest{font-size:clamp(.8rem,2.5vmin,1.05rem);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .min{font-size:clamp(.8rem,2.5vmin,1.05rem);color:var(--amber);text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;}
  .min.soon{color:var(--soon);}
  .delay{color:var(--soon);font-size:.72em;}
  .empty,.err{color:var(--muted);font-size:clamp(.78rem,2.3vmin,.95rem);padding:.4vmin 0;}
  .err{color:var(--soon);}
  .updated{text-align:right;color:var(--muted);font-size:.72rem;margin-top:1vmin;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">MVV</span>
    <h1>Abfahrten</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="board" id="board"></div>
  <div class="updated" id="updated"></div>

<script>
const WEGE = [
  { person: "Silberhornstraße",  id: "de:09162:1170", filterLine: "", filterZiel: "" },
  { person: "Ostfriedhof",       id: "de:09162:1105", filterLine: "", filterZiel: "" },
  { person: "St.-Martin-Straße", id: "de:09162:1100", filterLine: "", filterZiel: "" },
  { person: "Kolumbusplatz",     id: "de:09162:160",  filterLine: "", filterZiel: "" },
];

const PRIO_UBAHN = true;
const PRO_WEG    = 6;
const INTERVALL  = 30000;

const API = "https://www.mvg.de/api/bgw-pt/v3";
const PROXIES = [""];   // Fully Kiosk: "Disable Web Security" muss AN sein

async function holen(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const ziel = p ? p + encodeURIComponent(url) : url;
      const r = await fetch(ziel);
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("Kein Zugriff");
}

/* Echte Münchner Linienfarben (Annäherung an die offiziellen Werte) */
const LINIEN = {
  U1:"#438136", U2:"#C20831", U3:"#EC6726", U4:"#00A984", U5:"#BC7A00", U6:"#0065B1", U7:"#C20831", U8:"#EC6726",
  S1:"#16BAE7", S2:"#76B82A", S3:"#9B268F", S4:"#E30613", S5:"#F39200", S6:"#00975F", S7:"#943126", S8:"#5A5A5A", S20:"#ED6B22"
};
function farbe(label){
  const l=(label||"").toUpperCase();
  if(LINIEN[l]) return LINIEN[l];
  if(l.startsWith("S")) return "#00903a";  // sonstige S-Bahn grün
  if(l.startsWith("U")) return "#0065B1";  // sonstige U-Bahn blau
  return "#d11e2a";                         // Tram/Bus rot
}

async function abfahrten(id){ return await holen(`${API}/departures?globalId=${id}&limit=20`); }

function matcht(dep,weg){
  const label=(dep.label||"").toUpperCase();
  const ziel =(dep.destination||"").toLowerCase();
  if(weg.filterLine){
    const f=weg.filterLine.toUpperCase().replace("TRAM ","").replace("BUS ","").trim();
    if(!label.startsWith(f)) return false;
  }
  if(weg.filterZiel && !ziel.includes(weg.filterZiel.toLowerCase())) return false;
  return true;
}
function minuten(dep){ return Math.round(((dep.realtimeDepartureTime||dep.plannedDepartureTime)-Date.now())/60000); }

async function renderWeg(weg){
  const el=document.createElement("div");el.className="weg";
  el.innerHTML=`<div class="person">${weg.person}</div>`;
  try{
    let deps=(await abfahrten(weg.id)).filter(d=>!d.cancelled && matcht(d,weg) && minuten(d)>=0);
    deps.sort((a,b)=>{
      if(PRIO_UBAHN){
        const ua=(a.transportType==="UBAHN")?0:1, ub=(b.transportType==="UBAHN")?0:1;
        if(ua!==ub) return ua-ub;
      }
      return minuten(a)-minuten(b);
    });
    deps=deps.slice(0,PRO_WEG);
    if(deps.length===0){ el.innerHTML+=`<div class="empty">Keine passenden Abfahrten</div>`; }
    else for(const d of deps){
      const m=minuten(d), txt=m<=0?"jetzt":m+" min";
      const delay=(d.delayInMinutes>0)?`<span class="delay"> +${d.delayInMinutes}</span>`:"";
      el.innerHTML+=`<div class="row">
          <span class="badge" style="background:${farbe(d.label)}">${d.label||"?"}</span>
          <span class="dest">${d.destination||""}</span>
          <span class="min ${m<=2?'soon':''}">${txt}${delay}</span></div>`;
    }
  }catch(e){ el.innerHTML+=`<div class="err">⚠️ ${e.message||"Fehler beim Laden"}</div>`; }
  return el;
}

async function update(){
  const teile=await Promise.all(WEGE.map(renderWeg));
  document.getElementById("board").replaceChildren(...teile);
  document.getElementById("updated").textContent=
    "aktualisiert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function clock(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
clock(); setInterval(clock,10000);
update(); setInterval(update,INTERVALL);
</script>
</body>
</html>
