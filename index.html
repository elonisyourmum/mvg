<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MVV Abfahrten</title>
<style>
  :root{
    --bg:#0e1116;--card:#171b22;--line:#242a33;
    --ink:#f4f6f8;--muted:#8b95a1;--mgv:#0065B1;
    --gruen:#5ba368;--gelb:#c49a2e;--rot:#e85d4a;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--sys);background:var(--bg);color:var(--ink);overflow-y:auto;
       min-height:100vh;user-select:none;-webkit-font-smoothing:antialiased;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(1vmin + env(safe-area-inset-bottom)) env(safe-area-inset-left);}

  .topbar{display:flex;align-items:center;gap:1.1vmin;
          padding:1.6vmin 2.5vmin 1.2vmin;border-bottom:1px solid var(--line);
          position:sticky;top:0;background:var(--bg);z-index:10;}
  .logo{background:var(--mgv);color:#fff;font-weight:700;
        font-size:clamp(.82rem,2.8vmin,1.08rem);letter-spacing:.02em;
        padding:.3em .48em;border-radius:7px;line-height:1;}
  .topbar h1{font-size:clamp(.86rem,2.8vmin,1.1rem);font-weight:600;}
  .tbar-right{display:flex;align-items:center;gap:1em;margin-left:auto;}
  #weather{font-size:clamp(.74rem,2.3vmin,.95rem);color:var(--muted);white-space:nowrap;}
  #reload{display:inline-block;width:.85em;height:.85em;border-radius:50%;
           border:2px solid rgba(139,149,161,.35);border-top-color:var(--muted);
           opacity:.7;vertical-align:middle;transition:border-color .4s ease;}
  #reload.spinning{animation:spin .9s linear infinite;}
  #reload.fresh{border-color:rgba(91,163,104,.35);border-top-color:var(--gruen);opacity:1;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .clock{color:var(--muted);font-size:clamp(.86rem,2.8vmin,1.06rem);font-weight:500;font-variant-numeric:tabular-nums;}


  /* ── Abfahrten ── */
  .board{display:flex;flex-direction:column;gap:1.1vmin;padding:1.5vmin 2.5vmin .5vmin;}

  /* Querformat: 2×2-Raster */
  @media (orientation:landscape){
    .board{display:grid;grid-template-columns:1fr 1fr;gap:1vmin 1.4vmin;align-items:start;padding:1vmin 1.5vmin 0.5vmin!important;border-right:1px solid var(--line);margin-right:2.5vmin;}
    #updated{grid-column:1 / -1;font-size:.65rem;margin-top:0.5vmin;}
    .card{padding:0.7vmin 1vmin 0.35vmin;}
    .station{margin-bottom:0.3vmin;gap:0 .3em;}
    .sname{font-size:clamp(.82rem,2.4vmin,1rem);}
    .thresh{font-size:.6em;}
    .row{padding:.3vmin 0;}
    .badge{font-size:clamp(.65rem,2vmin,.85rem);}
    .dest{font-size:clamp(.76rem,2.2vmin,.95rem);}
    .tnum{font-size:clamp(.84rem,2.5vmin,1rem);}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
        padding:1.1vmin 1.5vmin .55vmin;overflow:hidden;position:relative;}
  .station{display:grid;grid-template-columns:1fr auto;gap:0 .4em;margin-bottom:.4vmin;}
  .sname{font-weight:600;font-size:clamp(.92rem,2.95vmin,1.16rem);grid-column:1;grid-row:1;align-self:baseline;}
  .missed-badge{grid-column:2;grid-row:1;font-size:.6em;color:var(--muted);font-weight:500;
                white-space:nowrap;align-self:baseline;text-align:right;}
  .thresh{font-size:.6em;color:var(--muted);font-weight:400;grid-column:1;grid-row:2;align-self:baseline;line-height:1.1;}
  .stoerung{grid-column:2;grid-row:2;min-width:0;overflow:hidden;white-space:nowrap;
            position:relative;height:1.25em;}
  .stoerung-inner{position:absolute;white-space:nowrap;color:var(--gelb);
                  font-size:.72em;font-weight:600;will-change:transform;
                  animation:marquee 14s linear infinite;}
  @keyframes marquee{from{transform:translateX(100%);}to{transform:translateX(-100%);}}
  .row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.65rem;
       padding:.46vmin 0;}
  .row + .row{border-top:1px solid var(--line);}
  .badge{color:#fff;border-radius:6px;font-weight:700;padding:.13em .44em;min-width:2.3em;
         text-align:center;font-size:clamp(.75rem,2.4vmin,.98rem);}
  .dest{font-size:clamp(.84rem,2.7vmin,1.07rem);font-weight:400;color:#d6dbe1;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .plat{font-size:.7em;color:var(--muted);font-weight:500;text-align:right;white-space:nowrap;min-width:2.8em;}
  .tcell{display:flex;align-items:center;justify-content:flex-end;gap:.3em;min-width:4.4em;}
  .tnum{font-size:clamp(.94rem,3vmin,1.18rem);font-weight:700;color:var(--ink);
        font-variant-numeric:tabular-nums;line-height:1;}
  .tunit{font-size:.67em;color:var(--muted);font-weight:500;}
  .tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.15;transform:scale(.6);}}
  .tdot.urgent{animation:pulse 1.8s ease-in-out infinite;}
  .card-msg{color:var(--muted);font-size:clamp(.74rem,2.1vmin,.9rem);padding:.35vmin 0;}
  .card-msg.err{color:var(--rot);}

</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">MVV</span>
    <h1>Abfahrten</h1>
    <div class="tbar-right">
      <span id="weather"></span>
      <span id="reload"></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>
  <div class="board" id="board"></div>
<script>
/* ══ Konfiguration ══════════════════════════════════════════════════ */
const WEGE=[
  // threshold = Fußweg in min (laut Google Maps)
  // minMin    = threshold - 2 (Laufpuffer: 2 min früher noch zeigen)
  {person:"Silberhornstraße", id:"de:09162:1170",threshold:9, filterLine:"U",filterZiel:"",minMin:5},
  {person:"Ostfriedhof",      id:"de:09162:1105",threshold:4, filterLine:"", filterZiel:"",minMin:2},
  {person:"St.-Martin-Straße",id:"de:09162:1100",threshold:12,filterLine:"", filterZiel:"",minMin:10},
  {person:"Kolumbusplatz",    id:"de:09162:160", threshold:10,filterLine:"U",filterZiel:"",minMin:8},
];


const PRO_WEG=6,FETCH_INT=30000,RENDER_INT=10000,RETRY_MS=10000;
const FADE=500,COLLAPSE=600,PULSE_MS=1800; // PULSE_MS muss = CSS pulse-Dauer (1.8s)
const API="https://www.mvg.de/api/bgw-pt/v3";
const PROXIES=[""];
const depCache={},errCache={},retryTmr={};
let lastFetchOk=Date.now(),lastRenderTime=Date.now();
const STALE_MS=120000; // 2 min ohne erfolgreichen Fetch = veraltet
const STOERUNG_INT=300000; // Störungen alle 5 min abrufen
let stoerungenByLine={}; // { 'U2': 'Titel', ... }
let minHeightSet=false;

/* ══ Helpers ════════════════════════════════════════════════════════ */
function getKey(d){return`${d.label}|${d.destination}|${d.plannedDepartureTime}`;}
function minuten(d){return Math.round(((d.realtimeDepartureTime||d.plannedDepartureTime)-Date.now())/60000);}
function statusFarbe(m,t){return m<=1?"var(--rot)":m<=t?"var(--gelb)":"var(--gruen)";}
function routeFarbe(m,fw){const r=m-fw;return r<=1?"var(--rot)":r<=3?"var(--gelb)":"var(--gruen)";}
function uhrzeitStr(d){return new Date(d.realtimeDepartureTime||d.plannedDepartureTime)
  .toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}

const LINIEN={U1:"#438136",U2:"#C20831",U3:"#EC6726",U4:"#00A984",U5:"#BC7A00",U6:"#0065B1",
              U7:"#C20831",U8:"#EC6726",S1:"#16BAE7",S2:"#76B82A",S3:"#9B268F",S4:"#E30613",
              S5:"#1c3f94",S6:"#00975F",S7:"#943126",S8:"#5A5A5A",S20:"#ED6B22"};
function farbe(label,type){const l=(label||"").toUpperCase();
  if(LINIEN[l])return LINIEN[l];
  if(type==="SBAHN"||l.startsWith("S"))return"#00903a";
  if(type==="UBAHN"||l.startsWith("U"))return"#0065B1";
  if(type==="TRAM")return"#d11e2a";return"#005CA8";}
function matcht(d,weg){
  const l=(d.label||"").toUpperCase(),z=(d.destination||"").toLowerCase();
  if(weg.filterLine&&!l.startsWith(weg.filterLine.toUpperCase()))return false;
  if(weg.filterZiel&&!z.includes(weg.filterZiel.toLowerCase()))return false;return true;}

/* ══ Abfahrten-Board ════════════════════════════════════════════════ */
const state={};

function fillRowEl(el,d,weg){
  const m=minuten(d),col=statusFarbe(m,weg.threshold);
  const del=m<=1?`;animation-delay:${-(Date.now()%PULSE_MS)}ms`:"";
  el.innerHTML=`
    <span class="badge" style="background:${farbe(d.label,d.transportType)}">${d.label||"?"}</span>
    <span class="dest">${d.destination||""}</span>
    <span class="plat">${d.platform?`Gl.${d.platform}`:""}</span>
    <span class="tcell">
      <span class="tnum" style="${m<=0?"color:var(--rot)":""}">${m<=0?"jetzt":m}</span>
      <span class="tunit">${m<=0?"":"min"}</span>
      <span class="tdot ${m<=1?"urgent":""}" style="background:${col}${del}"></span>
    </span>`;}

function updateRowEl(el,d,weg){
  const m=minuten(d),col=statusFarbe(m,weg.threshold);
  const tnum=el.querySelector(".tnum"),tunit=el.querySelector(".tunit"),tdot=el.querySelector(".tdot");
  if(tnum){tnum.textContent=m<=0?"jetzt":String(m);tnum.style.color=m<=0?"var(--rot)":"";}
  if(tunit)tunit.textContent=m<=0?"":"min";
  if(tdot){tdot.style.background=col;
    const urg=m<=1,was=tdot.classList.contains("urgent");
    if(urg&&!was){tdot.style.animationDelay=`${-(Date.now()%PULSE_MS)}ms`;tdot.classList.add("urgent");}
    else if(!urg&&was){tdot.classList.remove("urgent");tdot.style.animationDelay="";}}}

function updateStation(weg){
  if(!state[weg.id]){
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<div class="station"><span class="sname">${weg.person}</span><span class="missed-badge"></span><span class="thresh"></span><span class="stoerung"></span></div>`;
    state[weg.id]={cardEl:c,rows:new Map()};
    document.getElementById("board").appendChild(c);}
  const{cardEl,rows}=state[weg.id];
  // Gehzeit immer setzen (auch vor Daten-Load)
  const threshEl=cardEl.querySelector(".thresh");
  if(threshEl&&!threshEl.innerHTML)threshEl.innerHTML=`<svg viewBox=\"0 0 24 24\" width=\"0.95em\" height=\"0.95em\" fill=\"currentColor\" style=\"vertical-align:-0.15em\"><path d=\"M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z\"/></svg> ${weg.threshold} min`;
  let msg=cardEl.querySelector(".card-msg");
  const raw=depCache[weg.id];
  if(!raw){
    if(!msg){msg=document.createElement("div");msg.className="card-msg";cardEl.appendChild(msg);}
    msg.className=`card-msg ${errCache[weg.id]?"err":""}`;
    msg.textContent=errCache[weg.id]?`⚠️ ${errCache[weg.id]} – Retry…`:"Lade…";return;}
  if(msg)msg.remove();
  let deps=raw.filter(d=>!d.cancelled&&matcht(d,weg)&&minuten(d)>=(weg.minMin??1));
  deps.sort((a,b)=>minuten(a)-minuten(b));deps=deps.slice(0,PRO_WEG);
  // Verpasste: alle Abfahrten unter dem Lauf-Fenster (0 bis minMin)
  const mm=weg.minMin??1;
  const missedDeps=raw.filter(d=>!d.cancelled&&matcht(d,weg)
    &&minuten(d)>=0&&minuten(d)<mm);
  const badgeEl=cardEl.querySelector(".missed-badge");
  if(badgeEl){
    if(missedDeps.length){
      // nach Linie gruppieren mit Anzahl: "2×U2" oder "S3 S5"
      const cnt={};
      missedDeps.forEach(d=>{cnt[d.label]=(cnt[d.label]||0)+1;});
      const txt=Object.entries(cnt).map(([l,n])=>n>1?`${n}×${l}`:l).join(" ");
      badgeEl.textContent="↑ "+txt;
    } else badgeEl.textContent="";
  }
  const sortedKeys=deps.map(getKey);
  const newKeySet=new Set(sortedKeys);
  // Störungen: betroffene angezeigte Linien
  const stoerEl=cardEl.querySelector(".stoerung");
  if(stoerEl){
    const linien=[...new Set(deps.map(d=>(d.label||"").toUpperCase()))];
    const betroffen=linien.filter(l=>stoerungenByLine[l]);
    const txt=betroffen.map(l=>`⚠ ${l}: ${stoerungenByLine[l]}`).join("    •    ");
    if(stoerEl.dataset.txt!==txt){ // nur bei Änderung neu setzen (Marquee nicht resetten)
      stoerEl.dataset.txt=txt;
      if(txt){
        stoerEl.innerHTML='<span class="stoerung-inner"></span>';
        const inner=stoerEl.querySelector(".stoerung-inner");
        inner.textContent=txt;
        inner.style.animationDuration=Math.max(10,txt.length*0.35)+"s";
      }else stoerEl.innerHTML="";
    }
  }
  // ═══ FLIP-Animation: korrekte Sortierung + smoothe Übergänge ═══
  // Vorab-Check ohne Layout-Reads: brauchen wir überhaupt FLIP?
  let depHappened=false;
  for(const[k]of rows)if(!newKeySet.has(k)){depHappened=true;break;}
  let hasNew=false;
  for(const k of sortedKeys)if(!rows.has(k)){hasNew=true;break;}
  let domChanged=depHappened||hasNew;
  if(!domChanged){ // DOM-Reihenfolge prüfen (kein offsetTop!)
    let prev=cardEl.querySelector(".station");
    for(const k of sortedKeys){const el=rows.get(k);if(!el)continue;
      if(el.previousElementSibling!==prev){domChanged=true;break;}prev=el;}
  }
  // FIRST: Positionen nur lesen wenn nötig (verhindert Layout-Interrupts bei stabilem Render)
  const firstTop=new Map();
  if(domChanged)for(const[k,el]of rows)firstTop.set(k,el.offsetTop);

  // Abfahrende Zeilen: aus dem Fluss nehmen (absolute) + ausblenden
  for(const[key,rowEl]of rows){
    if(!newKeySet.has(key)){
      depHappened=true;rows.delete(key);
      const top=rowEl.offsetTop;
      rowEl.style.position="absolute";rowEl.style.top=top+"px";
      rowEl.style.left="0";rowEl.style.right="0";rowEl.style.pointerEvents="none";
      rowEl.style.transition=`opacity ${FADE}ms ease`;rowEl.style.opacity="0";
      setTimeout(()=>rowEl.remove(),FADE+40);
    }}

  // Bestehende Zeilen aktualisieren
  for(const d of deps){const k=getKey(d);if(rows.has(k))updateRowEl(rows.get(k),d,weg);}

  // Neue Zeilen anlegen (volle Höhe, opacity 0 – Position macht der Reorder)
  const newRows=new Set();
  for(let i=0;i<deps.length;i++){
    const k=sortedKeys[i];
    if(!rows.has(k)){
      const rowEl=document.createElement("div");rowEl.className="row";
      rowEl.style.opacity="0";fillRowEl(rowEl,deps[i],weg);
      rows.set(k,rowEl);newRows.add(rowEl);cardEl.appendChild(rowEl);
    }}

  // Alle Zeilen in korrekte sortierte DOM-Reihenfolge bringen
  const headerEl=cardEl.querySelector(".station");
  let prev=headerEl;
  for(const d of deps){const el=rows.get(getKey(d));if(el){prev.after(el);prev=el;}}

  // LAST + INVERT + PLAY: nur animieren wenn sich wirklich etwas verändert hat
  // → verhindert unnötige Layout-Reads die Blink/Marquee-Animationen stören
  if(newRows.size>0){
    requestAnimationFrame(()=>{
      for(const[k,el]of rows){
        if(newRows.has(el)){el.style.transition=`opacity ${FADE}ms ease`;el.style.opacity="1";}
      }
    });
  }
  // FLIP nur wenn departing rows da waren ODER DOM-Reihenfolge geändert wurde
  const needsFlip=domChanged;
  if(needsFlip) requestAnimationFrame(()=>{
    for(const[k,el]of rows){
      if(newRows.has(el))continue; // schon oben behandelt
      if(!firstTop.has(k))continue;
      const delta=firstTop.get(k)-el.offsetTop;
      if(Math.abs(delta)>0.5){
        el.style.transition="none";el.style.transform=`translateY(${delta}px)`;
        el.getBoundingClientRect();
        requestAnimationFrame(()=>{
          el.style.transition=`transform ${COLLAPSE}ms ease`;el.style.transform="";
          setTimeout(()=>{el.style.transition="";},COLLAPSE+30);
        });
      }
    }
  });}


/* ══ API ════════════════════════════════════════════════════════════ */
async function holen(url){let e;
  for(const p of PROXIES){try{const r=await fetch(p?p+encodeURIComponent(url):url);
    if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}catch(err){e=err;}}
  throw e||new Error("Kein Zugriff");}

async function fetchStop(id){
  try{depCache[id]=await holen(`${API}/departures?globalId=${id}&limit=40`);
      errCache[id]=null;lastFetchOk=Date.now();clearTimeout(retryTmr[id]);}
  catch(e){errCache[id]=e.message||"Fehler";clearTimeout(retryTmr[id]);
            retryTmr[id]=setTimeout(()=>fetchStop(id),RETRY_MS);}}

let _fetching=false;
async function fetchAll(){
  if(_fetching)return; // kein paralleler Fetch (z.B. nach Screen-Wake)
  _fetching=true;
  const rl=document.getElementById("reload");
  if(rl)rl.classList.add("spinning");
  await Promise.all(WEGE.map(w=>fetchStop(w.id)));
  if(rl)rl.classList.remove("spinning");
  _fetching=false;
}

async function fetchMessages(){
  try{
    const msgs=await holen(`${API}/messages`);
    const now=Date.now(),map={};
    for(const m of (msgs||[])){
      if(m.type!=="INCIDENT")continue;
      if(m.validFrom&&m.validFrom>now)continue;
      if(m.validTo&&m.validTo<now)continue;
      for(const ln of (m.lines||[])){
        // Label robust ermitteln (neue API: label; alt: lineNumber+product)
        let label=ln.label;
        if(!label&&ln.lineNumber){
          const p=(ln.product||ln.transportType||"").toUpperCase();
          const pre=p.includes("UBAHN")?"U":p.includes("SBAHN")?"S":"";
          const num=String(ln.lineNumber);
          label=num.toUpperCase().startsWith(pre)&&pre?num:pre+num; // kein doppeltes Präfix
        }
        label=(label||"").toUpperCase();
        if(label&&!map[label])map[label]=m.title||"Störung";
      }
    }
    stoerungenByLine=map;
  }catch(e){/* Störungen optional */}
}

async function fetchWeather(){
  try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=48.1170&longitude=11.5720&current=temperature_2m,weather_code&timezone=Europe%2FBerlin");
    const d=await r.json(),temp=Math.round(d.current.temperature_2m),code=d.current.weather_code;
    const ic=[[0,"☀️"],[3,"⛅"],[48,"🌫️"],[67,"🌧️"],[77,"❄️"],[82,"🌦️"],[99,"⛈️"]];
    document.getElementById("weather").textContent=`${(ic.find(([c])=>code<=c)||["",""])[1]} ${temp}°`;}
  catch(e){}}

/* ══ Render-Loop ════════════════════════════════════════════════════ */
function renderAll(){
  lastRenderTime=Date.now();
  // Grün sofort setzen wenn DOM bereit (unabhängig vom 1s Clock-Tick)
  const rl=document.getElementById("reload");
  if(rl){rl.classList.add("fresh");setTimeout(()=>rl.classList.remove("fresh"),900);}
  WEGE.forEach(updateStation);
  const board=document.getElementById("board");
  let ts=document.getElementById("updated");
  if(!ts){ts=document.createElement("div");ts.id="updated";ts.className="updated";}
}

function setMinHeights(){
  if(minHeightSet)return;minHeightSet=true;
  // Warten bis initiale Einblend-Animation (FADE) fertig ist
  requestAnimationFrame(()=>{
    Object.values(state).forEach(s=>{
      if(s.cardEl){
        s.cardEl.style.minHeight=""; // reset first
        const h=s.cardEl.getBoundingClientRect().height;
        if(h>0) s.cardEl.style.minHeight=h+"px";
      }
    });
  });}

function clock(){
  document.getElementById("clock").textContent=
    new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  const age=document.getElementById("age");
  if(!age)return;
  // Stale: reload rot blinken wenn keine Verbindung
  const rl=document.getElementById("reload");
  if(rl){const stale=Date.now()-lastFetchOk>STALE_MS;
    rl.style.borderTopColor=stale?"var(--rot)":"";rl.style.opacity=stale?"1":"";}}

clock();setInterval(clock,1000);
fetchWeather();setInterval(fetchWeather,600000);
fetchMessages().then(()=>renderAll());setInterval(()=>fetchMessages().then(()=>renderAll()),STOERUNG_INT);
renderAll();
// Burn-in-Schutz: Inhalt alle 3 min minimal verschieben (OLED)
document.body.style.transition="transform 4s ease";
setInterval(()=>{const dx=Math.floor(Math.random()*5)-2,dy=Math.floor(Math.random()*5)-2;
  document.body.style.transform=`translate(${dx}px,${dy}px)`;},180000);

fetchAll().then(()=>{ renderAll(); setTimeout(setMinHeights, 800); });
setInterval(renderAll,RENDER_INT);
setInterval(()=>fetchAll().then(renderAll),FETCH_INT);
</script>
</body>
</html>
