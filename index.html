<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVV Abfahrten</title>
<style>
  :root{
    --bg:#0e1116; --card:#171b22; --line:#242a33;
    --ink:#f4f6f8; --muted:#8b95a1;
    --mgv:#0065B1;
    --gruen:#5ba368;
    --gelb:#c49a2e;
    --rot:#e85d4a;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:var(--sys);background:var(--bg);color:var(--ink);
    padding:1.6vmin 2.2vmin 1.8vmin;overflow-y:auto;min-height:100vh;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;align-items:center;gap:1.1vmin;
    padding-bottom:1vmin;margin-bottom:1.2vmin;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .logo{background:var(--mgv);color:#fff;font-weight:700;
        font-size:clamp(.76rem,2.5vmin,1rem);letter-spacing:.02em;
        padding:.28em .46em;border-radius:7px;line-height:1;}
  .topbar h1{font-size:clamp(.8rem,2.5vmin,1.05rem);font-weight:600;}
  .topbar .clock{margin-left:auto;color:var(--muted);font-size:clamp(.8rem,2.5vmin,1.02rem);
                 font-weight:500;font-variant-numeric:tabular-nums;}

  .board{display:flex;flex-direction:column;gap:.9vmin;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
        padding:.9vmin 1.3vmin .45vmin;}
  .station{font-weight:600;font-size:clamp(.86rem,2.6vmin,1.08rem);margin-bottom:.45vmin;}

  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.65rem;
       padding:.38vmin 0;}
  .row + .row{border-top:1px solid var(--line);}

  .badge{color:#fff;border-radius:6px;font-weight:700;
         padding:.12em .42em;min-width:2.2em;text-align:center;
         font-size:clamp(.7rem,2.15vmin,.92rem);}
  .dest{font-size:clamp(.78rem,2.4vmin,1.01rem);font-weight:400;color:#d6dbe1;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Zeitspalte */
  .tcell{display:flex;align-items:baseline;justify-content:flex-end;gap:.22em;min-width:4.4em;}
  .tbar{width:3px;height:.85em;border-radius:2px;align-self:center;flex-shrink:0;}
  .tnum{font-size:clamp(.88rem,2.7vmin,1.12rem);font-weight:700;color:var(--ink);
        font-variant-numeric:tabular-nums;line-height:1;}
  .tunit{font-size:.67em;color:var(--muted);font-weight:500;}

  .empty,.err{color:var(--muted);font-size:clamp(.74rem,2.1vmin,.9rem);padding:.35vmin 0;}
  .err{color:var(--rot);}
  .updated{text-align:center;color:var(--muted);font-size:.68rem;margin-top:.7vmin;opacity:.6;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">MVV</span>
    <h1>Abfahrten</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="board" id="board"></div>
  <div class="updated" id="updated"></div>

<script>
const WEGE = [
  { person:"Silberhornstraße",  id:"de:09162:1170", threshold:9,  filterLine:"", filterZiel:"" },
  { person:"Ostfriedhof",       id:"de:09162:1105", threshold:3,  filterLine:"", filterZiel:"" },
  { person:"St.-Martin-Straße", id:"de:09162:1100", threshold:14, filterLine:"", filterZiel:"" },
  { person:"Kolumbusplatz",     id:"de:09162:160",  threshold:11, filterLine:"", filterZiel:"" },
];

const PRIO_UBAHN = true;
const PRO_WEG    = 5;
const INTERVALL  = 30000;
const API = "https://www.mvg.de/api/bgw-pt/v3";
const PROXIES = [""];

async function holen(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const ziel = p ? p+encodeURIComponent(url) : url;
      const r = await fetch(ziel);
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("Kein Zugriff");
}

const LINIEN = {
  U1:"#438136",U2:"#C20831",U3:"#EC6726",U4:"#00A984",U5:"#BC7A00",U6:"#0065B1",U7:"#C20831",U8:"#EC6726",
  S1:"#16BAE7",S2:"#76B82A",S3:"#9B268F",S4:"#E30613",S5:"#1c3f94",S6:"#00975F",S7:"#943126",S8:"#5A5A5A",S20:"#ED6B22"
};
function farbe(label){
  const l=(label||"").toUpperCase();
  if(LINIEN[l]) return LINIEN[l];
  if(l.startsWith("S")) return "#00903a";
  if(l.startsWith("U")) return "#0065B1";
  return "#d11e2a";
}

function statusFarbe(m, threshold){
  if(m<=1)         return "var(--rot)";
  if(m<=threshold) return "var(--gelb)";
  return "var(--gruen)";
}

function zeitHtml(m, threshold){
  const col = statusFarbe(m, threshold);
  if(m<=0) return `<span class="tcell"><span class="tnum" style="color:var(--rot)">jetzt</span><span class="tbar" style="background:${col}"></span></span>`;
  return `<span class="tcell"><span class="tnum">${m}</span><span class="tunit">min</span><span class="tbar" style="background:${col}"></span></span>`;
}

async function abfahrten(id){ return await holen(`${API}/departures?globalId=${id}&limit=20`); }

function matcht(dep,weg){
  const label=(dep.label||"").toUpperCase();
  const ziel=(dep.destination||"").toLowerCase();
  if(weg.filterLine){
    const f=weg.filterLine.toUpperCase().replace("TRAM ","").replace("BUS ","").trim();
    if(!label.startsWith(f)) return false;
  }
  if(weg.filterZiel&&!ziel.includes(weg.filterZiel.toLowerCase())) return false;
  return true;
}
function minuten(dep){ return Math.round(((dep.realtimeDepartureTime||dep.plannedDepartureTime)-Date.now())/60000); }

async function renderWeg(weg){
  const el=document.createElement("div");el.className="card";
  el.innerHTML=`<div class="station">${weg.person}</div>`;
  try{
    let deps=(await abfahrten(weg.id)).filter(d=>!d.cancelled&&matcht(d,weg)&&minuten(d)>=0);
    deps.sort((a,b)=>{
      if(PRIO_UBAHN){
        const ua=(a.transportType==="UBAHN")?0:1,ub=(b.transportType==="UBAHN")?0:1;
        if(ua!==ub) return ua-ub;
      }
      return minuten(a)-minuten(b);
    });
    deps=deps.slice(0,PRO_WEG);
    if(deps.length===0) el.innerHTML+=`<div class="empty">Keine Abfahrten</div>`;
    else for(const d of deps){
      const m=minuten(d);
      el.innerHTML+=`<div class="row">
        <span class="badge" style="background:${farbe(d.label)}">${d.label||"?"}</span>
        <span class="dest">${d.destination||""}</span>
        ${zeitHtml(m,weg.threshold)}
      </div>`;
    }
  }catch(e){ el.innerHTML+=`<div class="err">⚠️ ${e.message}</div>`; }
  return el;
}

async function update(){
  const teile=await Promise.all(WEGE.map(renderWeg));
  document.getElementById("board").replaceChildren(...teile);
  document.getElementById("updated").textContent=
    "aktualisiert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
}
function clock(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
clock(); setInterval(clock,10000);
update(); setInterval(update,INTERVALL);
</script>
</body>
</html>
