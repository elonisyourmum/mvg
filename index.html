<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVV Abfahrten</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#15181d; --line:#23272e;
    --ink:#f3f5f7; --muted:#828c98; --mvv:#00a13a;
    --amber:#ffc15e; --soon:#ff6b5a;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:var(--sys);background:var(--bg);color:var(--ink);
    padding:2vmin 2.6vmin 3vmin;overflow-y:auto;min-height:100vh;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;align-items:center;gap:1.2vmin;
    border-bottom:1px solid var(--line);
    padding-bottom:1.1vmin;margin-bottom:1.5vmin;
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .logo{background:var(--mvv);color:#fff;font-weight:700;
        font-size:clamp(.8rem,2.8vmin,1.15rem);line-height:1;letter-spacing:.03em;
        padding:.3em .48em;border-radius:7px;}
  .topbar h1{font-size:clamp(.85rem,2.8vmin,1.15rem);letter-spacing:.02em;font-weight:600;}
  .topbar .clock{margin-left:auto;color:var(--ink);font-size:clamp(.9rem,3vmin,1.2rem);
                 font-weight:600;font-variant-numeric:tabular-nums;}

  .board{display:flex;flex-direction:column;gap:1.1vmin;}
  .weg{background:var(--panel);border-radius:14px;padding:1vmin 1.4vmin .6vmin;}
  .person{font-weight:600;font-size:clamp(.9rem,2.8vmin,1.18rem);
          margin-bottom:.5vmin;color:var(--ink);}

  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;
       padding:.55vmin 0;}
  .row + .row{border-top:1px solid var(--line);}
  .badge{color:#fff;border-radius:6px;font-weight:700;
         padding:.14em .46em;min-width:2.3em;text-align:center;
         font-size:clamp(.75rem,2.4vmin,1rem);}
  .dest{font-size:clamp(.82rem,2.6vmin,1.08rem);font-weight:400;color:#dfe3e8;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Split-Flap / Zifferntafel-Look für die Zeit */
  .min{display:inline-flex;align-items:center;gap:.28em;justify-content:flex-end;
       color:var(--amber);white-space:nowrap;}
  .min.soon{color:var(--soon);}
  .flap{display:inline-flex;gap:2px;}
  .flap b{
    position:relative;display:inline-block;min-width:1.05em;text-align:center;
    font-family:var(--mono);font-weight:700;color:currentColor;
    font-size:clamp(.82rem,2.6vmin,1.06rem);line-height:1.25;
    padding:.12em .12em;border-radius:4px;
    background:linear-gradient(#2b313d 0 50%, #1e242d 50% 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), 0 1px 1px rgba(0,0,0,.4);
  }
  .flap b::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:1px;
                 background:rgba(0,0,0,.6);transform:translateY(-.5px);}
  .unit{font-size:.72em;color:var(--muted);font-weight:600;letter-spacing:.02em;}
  .delay{color:var(--soon);font-size:.7em;font-weight:700;}

  .empty,.err{color:var(--muted);font-size:clamp(.78rem,2.3vmin,.95rem);padding:.4vmin 0;}
  .err{color:var(--soon);}
  .updated{text-align:right;color:var(--muted);font-size:.72rem;margin-top:1vmin;
           font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">MVV</span>
    <h1>Abfahrten</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="board" id="board"></div>
  <div class="updated" id="updated"></div>

<script>
const WEGE = [
  { person: "Silberhornstraße",  id: "de:09162:1170", filterLine: "", filterZiel: "" },
  { person: "Ostfriedhof",       id: "de:09162:1105", filterLine: "", filterZiel: "" },
  { person: "St.-Martin-Straße", id: "de:09162:1100", filterLine: "", filterZiel: "" },
  { person: "Kolumbusplatz",     id: "de:09162:160",  filterLine: "", filterZiel: "" },
];

const PRIO_UBAHN = true;
const PRO_WEG    = 6;
const INTERVALL  = 30000;

const API = "https://www.mvg.de/api/bgw-pt/v3";
const PROXIES = [""];   // Fully Kiosk: "Disable Web Security" muss AN sein

async function holen(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const ziel = p ? p + encodeURIComponent(url) : url;
      const r = await fetch(ziel);
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("Kein Zugriff");
}

const LINIEN = {
  U1:"#438136", U2:"#C20831", U3:"#EC6726", U4:"#00A984", U5:"#BC7A00", U6:"#0065B1", U7:"#C20831", U8:"#EC6726",
  S1:"#16BAE7", S2:"#76B82A", S3:"#9B268F", S4:"#E30613", S5:"#1c3f94", S6:"#00975F", S7:"#943126", S8:"#5A5A5A", S20:"#ED6B22"
};
function farbe(label){
  const l=(label||"").toUpperCase();
  if(LINIEN[l]) return LINIEN[l];
  if(l.startsWith("S")) return "#00903a";
  if(l.startsWith("U")) return "#0065B1";
  return "#d11e2a";
}

/* erzeugt die Kachel-Ziffern */
function flap(str){ return `<span class="flap">`+[...str].map(c=>`<b>${c}</b>`).join("")+`</span>`; }

async function abfahrten(id){ return await holen(`${API}/departures?globalId=${id}&limit=20`); }

function matcht(dep,weg){
  const label=(dep.label||"").toUpperCase();
  const ziel =(dep.destination||"").toLowerCase();
  if(weg.filterLine){
    const f=weg.filterLine.toUpperCase().replace("TRAM ","").replace("BUS ","").trim();
    if(!label.startsWith(f)) return false;
  }
  if(weg.filterZiel && !ziel.includes(weg.filterZiel.toLowerCase())) return false;
  return true;
}
function minuten(dep){ return Math.round(((dep.realtimeDepartureTime||dep.plannedDepartureTime)-Date.now())/60000); }

async function renderWeg(weg){
  const el=document.createElement("div");el.className="weg";
  el.innerHTML=`<div class="person">${weg.person}</div>`;
  try{
    let deps=(await abfahrten(weg.id)).filter(d=>!d.cancelled && matcht(d,weg) && minuten(d)>=0);
    deps.sort((a,b)=>{
      if(PRIO_UBAHN){
        const ua=(a.transportType==="UBAHN")?0:1, ub=(b.transportType==="UBAHN")?0:1;
        if(ua!==ub) return ua-ub;
      }
      return minuten(a)-minuten(b);
    });
    deps=deps.slice(0,PRO_WEG);
    if(deps.length===0){ el.innerHTML+=`<div class="empty">Keine passenden Abfahrten</div>`; }
    else for(const d of deps){
      const m=minuten(d);
      const zeit = m<=0 ? flap("JETZT") : flap(String(m))+`<span class="unit">min</span>`;
      const delay=(d.delayInMinutes>0)?`<span class="delay">+${d.delayInMinutes}</span>`:"";
      el.innerHTML+=`<div class="row">
          <span class="badge" style="background:${farbe(d.label)}">${d.label||"?"}</span>
          <span class="dest">${d.destination||""}</span>
          <span class="min ${m<=2?'soon':''}">${zeit}${delay}</span></div>`;
    }
  }catch(e){ el.innerHTML+=`<div class="err">⚠️ ${e.message||"Fehler beim Laden"}</div>`; }
  return el;
}

async function update(){
  const teile=await Promise.all(WEGE.map(renderWeg));
  document.getElementById("board").replaceChildren(...teile);
  document.getElementById("updated").textContent=
    "aktualisiert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function clock(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
clock(); setInterval(clock,10000);
update(); setInterval(update,INTERVALL);
</script>
</body>
</html>
