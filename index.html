<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVV Abfahrten</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fjalla+One&family=Barlow+Semi+Condensed:wght@500;600&family=DM+Mono:wght@500&display=swap');
 
  :root{
    --bg:#0a0c0f; --panel:#13171d; --line:#222a33;
    --ink:#f2f5f8; --muted:#7c8896; --mvv:#00a13a;
    --amber:#ffb000; --soon:#ff5a4d;
    --ubahn:#0065ae; --sbahn:#00903a; --rest:#d11e2a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Barlow Semi Condensed',sans-serif;
    background:var(--bg);color:var(--ink);
    padding:2.4vmin 3.2vmin 4vmin;
    overflow-y:auto;min-height:100vh;user-select:none;
  }
  .topbar{
    display:flex;align-items:center;gap:1.4vmin;
    border-bottom:2px solid var(--mvv);
    padding-bottom:1.1vmin;margin-bottom:1.6vmin;
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .logo{
    font-family:'Fjalla One',sans-serif;background:var(--mvv);color:#fff;
    font-size:clamp(1rem,3.6vmin,1.5rem);line-height:1;letter-spacing:.06em;
    padding:.3em .48em .24em;border-radius:8px;
  }
  .topbar h1{font-family:'Fjalla One',sans-serif;font-size:clamp(1rem,3.4vmin,1.4rem);letter-spacing:.05em;text-transform:uppercase;font-weight:400;}
  .topbar .clock{margin-left:auto;font-family:'DM Mono',monospace;color:var(--amber);font-size:clamp(1rem,3.4vmin,1.4rem);}
 
  .board{display:flex;flex-direction:column;gap:1.3vmin;}
  .weg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.2vmin 1.5vmin;}
  .weg-head{margin-bottom:.7vmin;}
  .person{font-family:'Fjalla One',sans-serif;font-size:clamp(.95rem,3vmin,1.3rem);letter-spacing:.02em;}
 
  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem;
       padding:.6vmin 0;border-top:1px solid var(--line);}
  .row:first-of-type{border-top:none;}
  .badge{font-family:'Fjalla One',sans-serif;color:#fff;border-radius:6px;
         padding:.16em .5em;min-width:2.4em;text-align:center;font-size:clamp(.8rem,2.5vmin,1.05rem);}
  .dest{font-size:clamp(.85rem,2.6vmin,1.1rem);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .min{font-family:'DM Mono',monospace;font-size:clamp(.85rem,2.7vmin,1.15rem);color:var(--amber);text-align:right;white-space:nowrap;}
  .min.soon{color:var(--soon);}
  .delay{color:var(--soon);font-size:.7em;}
  .empty,.err{color:var(--muted);font-size:clamp(.8rem,2.4vmin,1rem);padding:.5vmin 0;}
  .err{color:var(--soon);}
  .updated{text-align:right;color:var(--muted);font-size:.75rem;font-family:'DM Mono',monospace;margin-top:1.4vmin;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">MVV</span>
    <h1>Abfahrten</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="board" id="board"></div>
  <div class="updated" id="updated"></div>
 
<script>
const WEGE = [
  { person: "Silberhornstraße",  id: "de:09162:1170", filterLine: "", filterZiel: "" },
  { person: "Ostfriedhof",       id: "de:09162:1105", filterLine: "", filterZiel: "" },
  { person: "St.-Martin-Straße", id: "de:09162:1100", filterLine: "", filterZiel: "" },
  { person: "Kolumbusplatz",     id: "de:09162:160",  filterLine: "", filterZiel: "" },
];
 
const PRIO_UBAHN = true;
const PRO_WEG    = 6;        // Fahrzeuge pro Station
const INTERVALL  = 30000;
 
const API = "https://www.mvg.de/api/bgw-pt/v3";
const PROXIES = [""];        // Fully Kiosk: "Disable Web Security" muss AN sein
 
async function holen(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const ziel = p ? p + encodeURIComponent(url) : url;
      const r = await fetch(ziel);
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("Kein Zugriff");
}
 
/* U-Bahn blau, S-Bahn grün, alles andere rot */
function farbe(label){
  const l=(label||"").toUpperCase();
  if(l.startsWith("U")) return "var(--ubahn)";
  if(l.startsWith("S")) return "var(--sbahn)";
  return "var(--rest)";
}
 
async function abfahrten(id){ return await holen(`${API}/departures?globalId=${id}&limit=20`); }
 
function matcht(dep,weg){
  const label=(dep.label||"").toUpperCase();
  const ziel =(dep.destination||"").toLowerCase();
  if(weg.filterLine){
    const f=weg.filterLine.toUpperCase().replace("TRAM ","").replace("BUS ","").trim();
    if(!label.startsWith(f)) return false;
  }
  if(weg.filterZiel && !ziel.includes(weg.filterZiel.toLowerCase())) return false;
  return true;
}
function minuten(dep){ return Math.round(((dep.realtimeDepartureTime||dep.plannedDepartureTime)-Date.now())/60000); }
 
async function renderWeg(weg){
  const el=document.createElement("div");el.className="weg";
  el.innerHTML=`<div class="weg-head"><span class="person">${weg.person}</span></div>`;
  try{
    let deps=(await abfahrten(weg.id)).filter(d=>!d.cancelled && matcht(d,weg) && minuten(d)>=0);
    deps.sort((a,b)=>{
      if(PRIO_UBAHN){
        const ua=(a.transportType==="UBAHN")?0:1, ub=(b.transportType==="UBAHN")?0:1;
        if(ua!==ub) return ua-ub;
      }
      return minuten(a)-minuten(b);
    });
    deps=deps.slice(0,PRO_WEG);
    if(deps.length===0){ el.innerHTML+=`<div class="empty">Keine passenden Abfahrten</div>`; }
    else for(const d of deps){
      const m=minuten(d), txt=m<=0?"jetzt":m+" min";
      const delay=(d.delayInMinutes>0)?`<span class="delay"> +${d.delayInMinutes}</span>`:"";
      el.innerHTML+=`<div class="row">
          <span class="badge" style="background:${farbe(d.label)}">${d.label||"?"}</span>
          <span class="dest">${d.destination||""}</span>
          <span class="min ${m<=2?'soon':''}">${txt}${delay}</span></div>`;
    }
  }catch(e){ el.innerHTML+=`<div class="err">⚠️ ${e.message||"Fehler beim Laden"}</div>`; }
  return el;
}
 
async function update(){
  const teile=await Promise.all(WEGE.map(renderWeg));
  document.getElementById("board").replaceChildren(...teile);
  document.getElementById("updated").textContent=
    "aktualisiert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function clock(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
clock(); setInterval(clock,10000);
update(); setInterval(update,INTERVALL);
</script>
</body>
</html>
