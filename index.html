<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVV Abfahrten</title>
<style>
  :root{
    --bg:#0e1116; --card:#171b22; --line:#242a33;
    --ink:#f4f6f8; --muted:#8b95a1; --mgv:#0065B1;
    --gruen:#5ba368; --gelb:#c49a2e; --rot:#e85d4a;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:var(--sys);background:var(--bg);color:var(--ink);
    padding:1.9vmin 2.5vmin 2.1vmin;overflow-y:auto;min-height:100vh;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;align-items:center;gap:1.1vmin;
    padding-bottom:1.2vmin;margin-bottom:1.5vmin;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .logo{background:var(--mgv);color:#fff;font-weight:700;
        font-size:clamp(.82rem,2.8vmin,1.08rem);letter-spacing:.02em;
        padding:.3em .48em;border-radius:7px;line-height:1;}
  .topbar h1{font-size:clamp(.86rem,2.8vmin,1.1rem);font-weight:600;}
  .tbar-right{display:flex;align-items:center;gap:1em;margin-left:auto;}
  #weather{font-size:clamp(.74rem,2.3vmin,.95rem);color:var(--muted);white-space:nowrap;}
  .clock{color:var(--muted);font-size:clamp(.86rem,2.8vmin,1.06rem);font-weight:500;font-variant-numeric:tabular-nums;}

  .board{display:flex;flex-direction:column;gap:1.1vmin;}

  /* Karte: display:flex damit CSS order funktioniert */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:1.1vmin 1.5vmin .55vmin;
    display:flex;flex-direction:column;
  }
  .station{display:flex;align-items:baseline;gap:.4em;margin-bottom:.55vmin;flex-shrink:0;}
  .sname{font-weight:600;font-size:clamp(.92rem,2.95vmin,1.16rem);}
  .thresh{font-size:.65em;color:var(--muted);font-weight:400;}

  /* Feste Zeilen: transition nur auf opacity und transform */
  .row{
    display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.65rem;
    padding:.46vmin 0;
    transition:opacity 500ms ease, transform 500ms ease;
  }
  .row:not(:last-child){border-bottom:1px solid var(--line);}

  .badge{color:#fff;border-radius:6px;font-weight:700;
         padding:.13em .44em;min-width:2.3em;text-align:center;
         font-size:clamp(.75rem,2.4vmin,.98rem);}
  .dest{font-size:clamp(.84rem,2.7vmin,1.07rem);font-weight:400;color:#d6dbe1;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .plat{font-size:.7em;color:var(--muted);font-weight:500;text-align:right;
        white-space:nowrap;min-width:2.8em;}
  .tcell{display:flex;align-items:center;justify-content:flex-end;gap:.3em;min-width:4.4em;}
  .tnum{font-size:clamp(.94rem,3vmin,1.18rem);font-weight:700;color:var(--ink);
        font-variant-numeric:tabular-nums;line-height:1;}
  .tunit{font-size:.67em;color:var(--muted);font-weight:500;}
  .tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.15;transform:scale(.6);}}
  .tdot.urgent{animation:pulse 1.8s ease-in-out infinite;}

  .card-msg{color:var(--muted);font-size:clamp(.74rem,2.1vmin,.9rem);padding:.35vmin 0;}
  .card-msg.err{color:var(--rot);}
  .updated{text-align:center;color:var(--muted);font-size:.74rem;margin-top:.9vmin;
           font-variant-numeric:tabular-nums;opacity:.6;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">MVV</span>
    <h1>Abfahrten</h1>
    <div class="tbar-right">
      <span id="weather"></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="updated" id="updated"></div>

<script>
const WEGE = [
  { person:"Silberhornstraße",  id:"de:09162:1170", threshold:9,  filterLine:"U", filterZiel:"" },
  { person:"Ostfriedhof",       id:"de:09162:1105", threshold:3,  filterLine:"",  filterZiel:"" },
  { person:"St.-Martin-Straße", id:"de:09162:1100", threshold:14, filterLine:"",  filterZiel:"" },
  { person:"Kolumbusplatz",     id:"de:09162:160",  threshold:11, filterLine:"U", filterZiel:"" },
];
const PRO_WEG=6, FETCH_INT=30000, RENDER_INT=10000, RETRY_MS=10000;
const FADE=500; // ms für Crossfade
const API="https://www.mvg.de/api/bgw-pt/v3";
const PROXIES=[""];
const depCache={}, errCache={}, retryTmr={};

/* ── Pro Station: feste Slots, nie hinzugefügt/entfernt ── */
const stSlots={}; // id → { cardEl, rowEls:[], slotKeys:[], keyToSlot:{} }

function initSlots(weg){
  const cardEl=document.createElement("div"); cardEl.className="card";
  cardEl.innerHTML=`<div class="station"><span class="sname">${weg.person}</span><span class="thresh">~${weg.threshold+1} min</span></div>`;
  const rowEls=[], slotKeys=new Array(PRO_WEG).fill(null), keyToSlot={};
  for(let i=0;i<PRO_WEG;i++){
    const el=document.createElement("div"); el.className="row";
    el.style.opacity="0"; el.style.visibility="hidden"; el.style.order=i;
    cardEl.appendChild(el); rowEls.push(el);
  }
  stSlots[weg.id]={cardEl,rowEls,slotKeys,keyToSlot};
  document.getElementById("board").appendChild(cardEl);
}

/* ── Zeile befüllen / aktualisieren ── */
const LINIEN={U1:"#438136",U2:"#C20831",U3:"#EC6726",U4:"#00A984",U5:"#BC7A00",U6:"#0065B1",U7:"#C20831",U8:"#EC6726",
              S1:"#16BAE7",S2:"#76B82A",S3:"#9B268F",S4:"#E30613",S5:"#1c3f94",S6:"#00975F",S7:"#943126",S8:"#5A5A5A",S20:"#ED6B22"};
function farbe(label,type){ const l=(label||"").toUpperCase();
  if(LINIEN[l]) return LINIEN[l];
  if(type==="SBAHN"||l.startsWith("S")) return "#00903a";
  if(type==="UBAHN"||l.startsWith("U")) return "#0065B1";
  if(type==="TRAM") return "#d11e2a"; return "#005CA8"; }
function statusFarbe(m,t){ return m<=1?"var(--rot)":m<=t?"var(--gelb)":"var(--gruen)"; }
function minuten(d){ return Math.round(((d.realtimeDepartureTime||d.plannedDepartureTime)-Date.now())/60000); }
function getKey(d){ return `${d.label}|${d.destination}|${d.plannedDepartureTime}`; }
function matcht(d,weg){
  const l=(d.label||"").toUpperCase(), z=(d.destination||"").toLowerCase();
  if(weg.filterLine&&!l.startsWith(weg.filterLine.toUpperCase())) return false;
  if(weg.filterZiel&&!z.includes(weg.filterZiel.toLowerCase())) return false; return true; }

function fillSlot(el,d,weg){
  const m=minuten(d), col=statusFarbe(m,weg.threshold);
  const del=`${m<=1?`;animation-delay:${-(Date.now()%1800)}ms`:''}`;
  el.innerHTML=`
    <span class="badge" style="background:${farbe(d.label,d.transportType)}">${d.label||"?"}</span>
    <span class="dest">${d.destination||""}</span>
    <span class="plat">${d.platform?`Gl.${d.platform}`:""}</span>
    <span class="tcell">
      <span class="tnum" style="${m<=0?'color:var(--rot)':''}">${m<=0?"jetzt":m}</span>
      <span class="tunit">${m<=0?"":"min"}</span>
      <span class="tdot ${m<=1?'urgent':''}" style="background:${col}${del}"></span>
    </span>`;
}
function updateSlot(el,d,weg){
  const m=minuten(d), col=statusFarbe(m,weg.threshold);
  const tnum=el.querySelector(".tnum"), tunit=el.querySelector(".tunit"), tdot=el.querySelector(".tdot");
  if(tnum){tnum.textContent=m<=0?"jetzt":String(m); tnum.style.color=m<=0?"var(--rot)":"";}
  if(tunit) tunit.textContent=m<=0?"":"min";
  if(tdot){
    tdot.style.background=col;
    const urg=m<=1, was=tdot.classList.contains("urgent");
    if(urg&&!was){tdot.style.animationDelay=`${-(Date.now()%1800)}ms`; tdot.classList.add("urgent");}
    else if(!urg&&was){tdot.classList.remove("urgent"); tdot.style.animationDelay="";}
  }
}

/* ── Crossfade: Slot ausblenden → Inhalt wechseln → einblenden ── */
function crossfade(el, fillFn, delay=0){
  setTimeout(()=>{
    el.style.opacity="0";
    el.style.visibility="visible";
    setTimeout(()=>{
      fillFn(el);
      el.getBoundingClientRect();
      el.style.opacity="1";
    }, FADE);
  }, delay);
}
function fadeOut(el, delay=0){
  setTimeout(()=>{
    el.style.opacity="0";
    setTimeout(()=>{ el.style.visibility="hidden"; }, FADE);
  }, delay);
}
function fadeIn(el, fillFn, delay=0){
  setTimeout(()=>{
    fillFn(el);
    el.style.opacity="0";
    el.style.visibility="visible";
    el.getBoundingClientRect();
    el.style.opacity="1";
  }, delay);
}

/* ── Station aktualisieren ── */
function updateStation(weg){
  if(!stSlots[weg.id]) initSlots(weg);
  const {cardEl,rowEls,slotKeys,keyToSlot}=stSlots[weg.id];

  /* Lade-/Fehlerstatus */
  let msg=cardEl.querySelector(".card-msg");
  const raw=depCache[weg.id];
  if(!raw){
    if(!msg){msg=document.createElement("div"); msg.className="card-msg"; cardEl.appendChild(msg);}
    msg.className=`card-msg ${errCache[weg.id]?"err":""}`;
    msg.textContent=errCache[weg.id]?`⚠️ ${errCache[weg.id]} – Retry…`:"Lade…"; return;
  }
  if(msg) msg.remove();

  let deps=raw.filter(d=>!d.cancelled&&matcht(d,weg)&&minuten(d)>=0);
  deps.sort((a,b)=>minuten(a)-minuten(b)); deps=deps.slice(0,PRO_WEG);

  const newKeySet=new Set(deps.map(getKey));
  const oldKeySet=new Set(slotKeys.filter(k=>k!==null));

  /* Departing keys: im Slot aber nicht mehr in deps */
  const departingKeys=[...oldKeySet].filter(k=>!newKeySet.has(k));
  /* Arriving deps: in deps aber noch kein Slot */
  const arrivingDeps=deps.filter(d=>!oldKeySet.has(getKey(d)));

  /* 1. Bestehende Slots: nur Zeit in-place updaten, CSS-Order aktualisieren */
  deps.forEach((d,visualIdx)=>{
    const k=getKey(d);
    if(oldKeySet.has(k)&&keyToSlot[k]!==undefined){
      const sl=keyToSlot[k];
      rowEls[sl].style.order=visualIdx; // neue visuelle Position
      updateSlot(rowEls[sl],d,weg);
    }
  });

  /* 2. Departing + Arriving koppeln: selber Slot wird wiederverwendet */
  departingKeys.forEach((dk,i)=>{
    const sl=keyToSlot[dk];
    const el=rowEls[sl];
    const arriving=arrivingDeps[i]||null;

    if(arriving){
      /* Crossfade: ausblenden → Inhalt wechseln → einblenden */
      const visualIdx=deps.findIndex(d=>getKey(d)===getKey(arriving));
      const newKey=getKey(arriving);
      crossfade(el, (e)=>{ fillSlot(e,arriving,weg); e.style.order=visualIdx; });
      delete keyToSlot[dk]; slotKeys[sl]=newKey; keyToSlot[newKey]=sl;
    } else {
      /* Keine neue Abfahrt: Slot ausblenden */
      fadeOut(el);
      delete keyToSlot[dk]; slotKeys[sl]=null;
    }
  });

  /* 3. Überzählige Arrivals (mehr Ankünfte als Abfahrten): freie Slots suchen */
  arrivingDeps.slice(departingKeys.length).forEach(d=>{
    const freeSlot=slotKeys.findIndex(k=>k===null); if(freeSlot===-1) return;
    const k=getKey(d), vIdx=deps.findIndex(dep=>getKey(dep)===k);
    const el=rowEls[freeSlot];
    fadeIn(el, (e)=>{ fillSlot(e,d,weg); e.style.order=vIdx; });
    slotKeys[freeSlot]=k; keyToSlot[k]=freeSlot;
  });
}

/* ── API & Wetter ── */
async function holen(url){
  let e; for(const p of PROXIES){
    try{const r=await fetch(p?p+encodeURIComponent(url):url); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json();}catch(err){e=err;}
  } throw e||new Error("Kein Zugriff");
}
async function fetchStation(weg){
  try{ depCache[weg.id]=await holen(`${API}/departures?globalId=${weg.id}&limit=40`); errCache[weg.id]=null; clearTimeout(retryTmr[weg.id]); }
  catch(e){ errCache[weg.id]=e.message||"Fehler"; clearTimeout(retryTmr[weg.id]); retryTmr[weg.id]=setTimeout(()=>fetchStation(weg),RETRY_MS); }
}
async function fetchAll(){ await Promise.all(WEGE.map(fetchStation)); }

async function fetchWeather(){
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=48.1170&longitude=11.5720&current=temperature_2m,weather_code&timezone=Europe%2FBerlin");
    const d=await r.json(), temp=Math.round(d.current.temperature_2m), code=d.current.weather_code;
    const icons=[[0,"☀️"],[3,"⛅"],[48,"🌫️"],[67,"🌧️"],[77,"❄️"],[82,"🌦️"],[99,"⛈️"]];
    document.getElementById("weather").textContent=`${(icons.find(([c])=>code<=c)||["",""])[1]} ${temp}°`;
  }catch(e){}
}

function renderAll(){ WEGE.forEach(updateStation); document.getElementById("updated").textContent="aktualisiert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); }
function clock(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }

clock(); setInterval(clock,10000);
fetchWeather(); setInterval(fetchWeather,600000);
renderAll(); // Slots anlegen (leer)
fetchAll().then(renderAll); // Daten laden
setInterval(renderAll,RENDER_INT);
setInterval(()=>fetchAll().then(renderAll),FETCH_INT);
</script>
</body>
</html>
